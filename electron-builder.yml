appId: dev.claudeterm.app
productName: ClaudeTerm
executableName: ClaudeTerm
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: resources/mcp
    to: mcp
    filter: ["*.js"]
  - from: resources/hook
    to: hook
    filter: ["*.js"]
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClaudeTerm
  include: build/installer.nsh
  artifactName: ClaudeTerm-Setup-${version}.${ext}
linux:
  target:
    - target: deb
      arch: [x64]
  executableName: claudeterm
  category: Development
  synopsis: A terminal built for Claude Code
  maintainer: Dmitry Vergasov
deb:
  artifactName: ClaudeTerm-${version}.${ext}
mac:
  # the dmg for people, the zip for updates (latest-mac.yml lists it); one of each for Apple Silicon and Intel
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # no Developer ID: an ad-hoc signature, without which Apple Silicon does not run the app at all. The hardened
  # runtime would refuse Electron's own frameworks, signed by another team, and is needed only for notarization
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  artifactName: ClaudeTerm-${version}-${arch}.${ext}
zip:
  artifactName: ClaudeTerm-${version}-${arch}-mac.${ext}
