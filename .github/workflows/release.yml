name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build the installer and publish the release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      # the release notes are the version's section of CHANGELOG.md; without one the release stops here
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist -- --publish never

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml is what installed copies read to find a new version (electron-updater); the blockmap
        # lets them download only the changed parts
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/ClaudeTerm-Setup-*.exe dist/ClaudeTerm-Setup-*.exe.blockmap dist/latest.yml
          --title "ClaudeTerm ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
