name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build the Linux package
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb --publish never

      # the sign-ins are kept in the cookie store: without this fuse Electron writes them in plain text
      - name: Check that the packaged Linux app encrypts its cookies
        if: runner.os == 'Linux'
        env:
          FORCE_COLOR: '0'
        run: |
          npx @electron/fuses read --app dist/linux-unpacked/claudeterm > "$RUNNER_TEMP/fuses.txt"
          cat "$RUNNER_TEMP/fuses.txt"
          grep -q "EnableCookieEncryption is Enabled" "$RUNNER_TEMP/fuses.txt"

      - name: Keep the Linux package for a hand check
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/ClaudeTerm-*.deb
          retention-days: 7

      - name: Build the macOS packages
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Check that the packaged macOS apps encrypt their cookies
        if: runner.os == 'macOS'
        env:
          FORCE_COLOR: '0'
        run: |
          for app in dist/mac-arm64/ClaudeTerm.app dist/mac/ClaudeTerm.app; do
            npx @electron/fuses read --app "$app" > "$RUNNER_TEMP/fuses.txt"
            cat "$RUNNER_TEMP/fuses.txt"
            grep -q "EnableCookieEncryption is Enabled" "$RUNNER_TEMP/fuses.txt"
          done

      # node-pty starts every shell through spawn-helper: without its execute bit no tab opens
      - name: Check that the packaged spawn-helper can run
        if: runner.os == 'macOS'
        run: |
          test -x dist/mac-arm64/ClaudeTerm.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
          test -x dist/mac/ClaudeTerm.app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper

      - name: Keep the macOS packages for a hand check
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/ClaudeTerm-*.dmg
          retention-days: 7

  e2e:
    # the end-to-end tests run one at a time, each against its own app: four jobs per system share them out. The jobs are
    # split by spec file, so the one with the large chat specs runs longest (26 minutes on macOS in 0.22.0): the limit leaves
    # it room to grow and still stops a hung run
    name: End-to-end tests (${{ matrix.os }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: End-to-end tests
        if: runner.os == 'Linux'
        # no display and no setuid sandbox helper on the runner
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npx playwright test --shard=${{ matrix.shard }}/4

      - name: Keep end-to-end results when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
