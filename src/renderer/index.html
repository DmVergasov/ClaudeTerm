<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' ctimg: ctdoc: data:; frame-src ctdoc:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>ClaudeTerm</title>
  </head>
  <body>
    <div id="app">
      <div id="titlebar"></div>
      <div id="tabbar"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="update-banner" class="banner" hidden></div>
      <div id="main-row">
        <div id="tabpanel" hidden></div>
        <div id="sheet">
          <div id="sheet-header"></div>
          <div id="workspace">
            <div id="terminals"><div id="note"></div><div id="search" hidden></div></div>
            <div id="image-panel" class="collapsed"></div>
          </div>
          <div id="statusbar" hidden></div>
        </div>
      </div>
    </div>
    <div id="plan-list" hidden></div>
    <div id="lightbox" hidden></div>
    <div id="sessions" hidden></div>
    <div id="folder-dialog" hidden></div>
    <div id="toasts"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
